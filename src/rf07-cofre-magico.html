<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonetaGO - Cofre Mágico</title>

    <link rel="stylesheet" href="Estilos/rf07-cofre-magico.css">
</head>

<body>

    <header class="navbar">
        <a href="rf-painel.html" class="logo-area">
            <img src="Logo.jpeg" alt="Logotipo Moneta Go">
            <div class="logo-text">MONETA<span>GO</span></div>
        </a>

        <div class="navbar-right">
            <div class="help">❔ Ajuda</div>
            <a href="Autenticação/rf01-login.html" class="login-btn">Entrar</a>
        </div>
    </header>

    <main class="page">

        <section class="card">

            <h1>🏦 Cofre Mágico</h1>

            <p class="subtitle">
                Guarde moedas e acompanhe sua meta financeira
            </p>

            <div class="coin">
                🏦
            </div>

            <p class="goal">
                Meta atual: Notebook Gamer
            </p>

            <p class="value">
                R$ 1.350 / R$ 3.000
            </p>

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <p class="coins">
                🟡 1350 moedas acumuladas
            </p>

            <p class="hint">
                Continue economizando para desbloquear recompensas!
            </p>

            <button class="deposit-btn">
                Depositar moedas
            </button>

        </section>

    </main>

</body>
</html>
