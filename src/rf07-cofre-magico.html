<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonetaGO - Cofre Mágico</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #eef3f5;
      min-height: 100vh;
    }

    .navbar {
      height: 70px;
      background: #24384d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-area img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 800;
      color: #2f9fd3;
      letter-spacing: 0.5px;
    }

    .logo-text span {
      color: #2ecc71;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .help {
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .login-btn {
      background: transparent;
      border: 2px solid #3498db;
      color: #3498db;
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #3498db;
      color: white;
    }

    .page {
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      background: white;
      width: 430px;
      padding: 38px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.10);
      text-align: center;
    }

    h1 {
      color: #24384d;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .coin {
      width: 90px;
      height: 90px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: linear-gradient(145deg, #ffd166, #f4a261);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      box-shadow: inset 0 0 0 6px rgba(255,255,255,0.25);
    }

    .goal {
      color: #1f2937;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .value {
      color: #2ecc71;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 24px;
    }

    .progress-bar {
      width: 100%;
      height: 24px;
      background: #dcdcdc;
      border-radius: 30px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress {
      width: 45%;
      height: 100%;
      background: #2ecc71;
      border-radius: 30px;
    }

    .coins {
      font-size: 19px;
      color: #1f2937;
      margin-bottom: 22px;
    }

    .hint {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 28px;
    }

    .deposit-btn {
      width: 100%;
      border: none;
      background: #2ecc71;
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .deposit-btn:hover {
      background: #27ae60;
    }
  </style>
</head>

<body>

  <header class="navbar">
    <a href="rf-painel.html" class="logo-area">
  <img src="Logo.jpeg" alt="Logotipo Moneta Go">
  <div class="logo-text">MONETA<span>GO</span></div>
</a>

    <div class="navbar-right">
      <div class="help">❔ Ajuda</div>
      <a href="Autenticação/rf01-login.html" class="login-btn">
  Entrar
</a>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <h1>🏦 Cofre Mágico</h1>

      <p class="subtitle">
        Guarde moedas e acompanhe sua meta financeira
      </p>

      <div class="coin">🏦</div>

      <p class="goal">
        Meta atual: Notebook Gamer
      </p>

      <p class="value">
        R$ 1.350 / R$ 3.000
      </p>

      <div class="progress-bar">
        <div class="progress"></div>
      </div>

      <p class="coins">
        🟡 1350 moedas acumuladas
      </p>

      <p class="hint">
        Continue economizando para desbloquear recompensas!
      </p>

      <button class="deposit-btn">
        Depositar moedas
      </button>
    </section>
  </main>

</body>
</html>
